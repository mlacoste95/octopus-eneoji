<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Octopus</title>
<style>
/* Layout: horizontal kanban, columns scroll together in one contained strip; a card opens a detail drawer with a stage selector (the reliable fallback to drag-and-drop) */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#EDE9E0;
  --ink:#1A1A1A; --ink-soft:#4A5550; --ink-muted:#8A9490;
  --brand:#2A3A35; --accent:#D6673B; --accent-deep:#C05530; --border:rgba(26,26,26,0.10);
  --success:#3E7A5E; --lost:#9B5A48;
  --font-display:"Archivo","Helvetica Neue",sans-serif;
  --font-body:"Manrope",-apple-system,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 48px;
}
h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}
button{font-family:var(--font-body);}

.topbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:12px 20px;
  margin-bottom:18px;
}
.brand-row{display:flex; align-items:center; gap:12px;}
.search-input{
  flex:1 1 220px; max-width:360px; font-family:var(--font-body); font-size:0.88rem;
  color:var(--ink); background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:9px 12px;
}
.search-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.octopus-mark{width:40px; height:40px; flex:none;}
.topbar h1{font-size:1.3rem; color:var(--brand);}
.topbar .sub{font-size:0.82rem; color:var(--ink-muted); margin-top:2px;}
.topbar-spacer{flex:1;}
.btn{
  font-family:var(--font-body); font-weight:700; font-size:0.86rem;
  border:none; border-radius:10px; padding:10px 16px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border);}
.btn-danger{background:transparent; color:#B23A2E; border:1px solid rgba(178,58,46,0.35);}
.btn-danger.confirm{background:#B23A2E; color:#fff; border-color:#B23A2E;}
.btn[disabled]{opacity:0.5; cursor:not-allowed;}
.btn[hidden]{display:none;}

.zone-filter{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.fab-new{display:none;}
.new-lead-toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:max(18px, env(safe-area-inset-bottom,0px));
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:11px 18px; font-family:var(--font-body); font-weight:700; font-size:0.86rem;
  box-shadow:0 6px 16px rgba(26,26,26,0.3); z-index:45; cursor:pointer;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
@media (max-width:640px){
  .topbar{ gap:10px; margin-bottom:14px; }
  .topbar h1{ font-size:1.1rem; }
  .octopus-mark{ width:32px; height:32px; }
  .topbar-spacer{ display:none; }
  .search-input{ flex-basis:100%; max-width:none; order:2; }
  #btnAccepted, #btnRefused{ order:3; flex:1 1 auto; font-size:0.74rem; padding:8px 6px; justify-content:center; }
  #btnNew{ display:none; }
  .fab-new{
    display:flex; align-items:center; justify-content:center;
    position:fixed; right:max(18px, env(safe-area-inset-right,0px));
    bottom:max(18px, env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:1.8rem; line-height:1;
    box-shadow:0 6px 16px rgba(26,26,26,0.3); z-index:40; cursor:pointer;
  }
  .zone-filter{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .zone-filter .zone-btn{ flex:none; }
}
.zone-btn{
  font-family:var(--font-body); font-weight:700; font-size:0.78rem;
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:6px 14px; cursor:pointer;
}
.zone-btn .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle;}
.zone-btn.active{background:var(--brand); color:var(--bg); border-color:var(--brand);}
.zone-badge{
  font-size:0.68rem; font-weight:700; border-radius:999px; padding:2px 8px;
  color:#fff; white-space:nowrap;
}

.status-banner{
  font-size:0.85rem; color:var(--ink-soft); background:var(--surface-2);
  border-radius:10px; padding:10px 14px; margin-bottom:16px;
}

#appRoot{
  display:flex; flex-direction:column;
  height:calc(100vh - 68px); height:calc(100dvh - 68px);
}
#appRoot[hidden]{display:none;}
.board{
  display:flex; align-items:flex-start; gap:14px; overflow-x:auto; padding-bottom:10px;
  scroll-snap-type:x proximity;
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.column{
  flex:0 0 272px; scroll-snap-align:start;
  display:flex; flex-direction:column; gap:10px;
}
.column-head{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display); font-weight:700; font-size:0.86rem;
  color:var(--ink); padding:2px 2px 4px;
  border-bottom:2px solid var(--col-accent, var(--border));
  position:sticky; top:0; z-index:5; background:var(--bg);
}
.column-head .dot{width:8px; height:8px; border-radius:50%; background:var(--col-accent, var(--ink-muted));}
.column-head .count{
  margin-left:auto; font-family:var(--font-body); font-weight:600; font-size:0.76rem;
  color:var(--ink-muted); background:var(--surface-2); border-radius:999px; padding:2px 8px;
}
.cards{display:flex; flex-direction:column; gap:8px; min-height:60px;}
.cards.drag-over{background:var(--surface-2); border-radius:10px;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:11px 12px; cursor:pointer; display:flex; flex-direction:column; gap:5px;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
}
.card:hover{border-color:var(--accent);}
.card.stale-warn{border-color:#C79A3E; border-width:1.5px;}
.card.stale-urgent{border-color:#B23A2E; border-width:1.5px;}
.stale-flag{font-size:0.72rem; font-weight:700;}
.stale-flag.warn{color:#9C7A2E;}
.stale-flag.urgent{color:#B23A2E;}
.card .name{font-weight:700; font-size:0.92rem; color:var(--ink);}
.card .name .city{font-weight:500; color:var(--ink-soft); font-size:0.9em;}
.card .meta{display:flex; align-items:center; flex-wrap:wrap; gap:6px;}
.card .meta .age{margin-left:auto;}
.badge{
  font-size:0.68rem; font-weight:700; letter-spacing:0.02em; text-transform:uppercase;
  color:var(--brand); background:var(--surface-2); border-radius:999px; padding:2px 8px;
}
.card .phone{font-size:0.78rem; font-variant-numeric:tabular-nums; color:var(--ink-soft); display:flex; align-items:center; gap:5px; background:none; border:none; padding:0; cursor:pointer; font-family:var(--font-body);}
.card .phone:hover{color:var(--accent-deep);}
.card .phone.copied{color:var(--success);}
.card .rdv-date{font-size:0.78rem; color:var(--brand); font-weight:700; font-variant-numeric:tabular-nums;}
.card .received-date{font-size:0.78rem; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
.gcal-link{
  display:inline-flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:700;
  color:var(--accent-deep); text-decoration:none;
}
.gcal-link:hover{text-decoration:underline;}

.photo-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
.photo-thumb{position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.photo-thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
.photo-thumb .rm{
  position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
  background:rgba(26,26,26,0.65); color:#fff; border:none; font-size:0.7rem; line-height:1; cursor:pointer;
}
.photo-thumb .photo-pending{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(26,26,26,0.45); font-size:1.1rem;
}
.photo-add{
  width:72px; height:72px; border-radius:10px; border:1.5px dashed var(--border);
  background:none; color:var(--ink-muted); font-size:1.4rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-add[disabled]{opacity:0.5;}

.annot-overlay{
  position:fixed; inset:0; background:rgba(16,20,18,0.88); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.annot-panel{
  background:var(--surface); border-radius:16px; padding:16px;
  display:flex; flex-direction:column; gap:12px;
  max-width:100%; max-height:100%;
}
.annot-stage{position:relative; margin:0 auto; max-width:100%; max-height:62vh;}
.annot-stage canvas{position:absolute; top:0; left:0; width:100%; height:100%; display:block; border-radius:10px;}
#annotBase{background:#111;}
#annotDraw{pointer-events:none;}
#annotStamps{pointer-events:none;}
#annotPreview{pointer-events:auto; touch-action:none; cursor:crosshair;}
.annot-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.annot-swatch{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--border);
  cursor:pointer; padding:0;
}
.annot-swatch.active{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink);}
.annot-tool-btn{
  font-size:0.76rem; font-weight:700; color:var(--ink-soft);
  background:none; border:1.5px solid var(--border); border-radius:8px; padding:5px 9px; cursor:pointer;
  line-height:1; white-space:nowrap;
}
.annot-tool-btn.active{border-color:var(--ink); color:var(--ink); background:var(--surface-2);}
.annot-tool-icon{vertical-align:middle; margin-right:3px;}
.annot-clear{
  margin-left:auto; font-size:0.8rem; font-weight:700; color:var(--ink-soft);
  background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; cursor:pointer;
}
.annot-actions{display:flex; justify-content:space-between; gap:10px;}
.view-stage{position:relative; overflow:hidden; max-width:100%; max-height:76vh; display:flex; align-items:center; justify-content:center; touch-action:none; border-radius:10px; background:#111;}
.view-stage img{max-width:100%; max-height:76vh; width:auto; height:auto; display:block; touch-action:none;}
.view-nav{
  position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.45); color:#fff;
  border:none; width:38px; height:38px; border-radius:50%; font-size:1.3rem; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.view-nav.prev{left:8px;}
.view-nav.next{right:8px;}
.annot-counter{font-size:0.78rem; color:var(--ink-muted); text-align:center;}
.hidden-list{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto;}
.hidden-list-row{
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer;
}
.hidden-list-row:hover{border-color:var(--accent);}
.hidden-list-meta{font-size:0.8rem; color:var(--ink-muted); margin-top:3px;}
.card .age{font-size:0.72rem; color:var(--ink-muted); white-space:nowrap;}
.source-ico{font-size:0.85rem; display:inline-flex; align-items:center;}
.source-ico img, .source-ico svg{width:14px; height:14px; border-radius:3px; display:block;}
.card .notes-preview{
  font-size:0.78rem; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

.col-add-card{
  font-family:var(--font-body); font-weight:700; font-size:0.8rem;
  color:var(--ink-muted); background:none; border:1.5px dashed var(--border);
  border-radius:12px; padding:10px; cursor:pointer; text-align:center;
}
.col-add-card:hover{color:var(--accent-deep); border-color:var(--accent);}
.relance-marker{
  font-family:var(--font-display); font-weight:700; font-size:0.74rem;
  color:#B23A2E; text-align:center; text-transform:uppercase; letter-spacing:0.04em;
  border-top:1.5px dashed #B23A2E; padding-top:8px; margin-top:2px;
}
.empty-tile{
  border:1.5px dashed var(--border); border-radius:12px; padding:16px 12px;
  text-align:center; font-size:0.78rem; color:var(--ink-muted);
}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(16,20,18,0.45);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;
  padding:0;
}
.overlay[hidden]{display:none;}
@media (min-width:640px){
  .overlay{align-items:center; padding:20px;}
}
.modal{
  background:var(--surface); width:100%; max-width:480px;
  max-height:92vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:22px 20px 24px;
  display:flex; flex-direction:column; gap:14px;
}
@media (min-width:640px){ .modal{border-radius:16px;} }
.modal h2{font-size:1.1rem; color:var(--brand);}
.field{display:flex; flex-direction:column; gap:5px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1; min-width:0;}
.field label{font-size:0.76rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.03em;}
.field input, .field select, .field textarea{
  font-family:var(--font-body); font-size:0.92rem; color:var(--ink);
  background:var(--bg); border:1px solid var(--border); border-radius:8px;
  padding:9px 11px; width:100%;
}
.field textarea{min-height:72px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.equip-check-group{display:flex; flex-wrap:wrap; gap:8px;}
.equip-check{
  display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600;
  text-transform:none; letter-spacing:normal; color:var(--ink); cursor:pointer;
  padding:9px 14px; min-height:40px; border:1.5px solid var(--border); border-radius:20px;
  background:var(--bg); -webkit-tap-highlight-color:transparent; user-select:none;
  transition:background .12s, border-color .12s, color .12s;
}
.equip-check input{position:absolute; opacity:0; width:1px; height:1px;}
.equip-check.checked{background:var(--accent); border-color:var(--accent); color:#fff;}
.modal-actions{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px;}
.modal-actions .right{display:flex; gap:8px;}
.modal-close{
  position:absolute; top:14px; right:14px; background:none; border:none;
  color:var(--ink-muted); font-size:1.3rem; cursor:pointer; line-height:1; padding:4px;
}
.modal-wrap{position:relative;}
.meta-row{font-size:0.74rem; color:var(--ink-muted);}
.save-status{font-size:0.72rem; font-weight:700; color:var(--ink-muted); margin-left:8px; vertical-align:middle;}
.save-status.ok{color:var(--success);}
.auth-gate{
  min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:24px;
}
.auth-gate[hidden]{display:none;}
.auth-gate .octopus-mark{width:64px; height:64px;}
.auth-gate h1{font-size:1.6rem; color:var(--brand);}
.auth-gate p{color:var(--ink-soft); font-size:0.92rem; max-width:320px; margin:0;}
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <svg class="octopus-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M14 30 Q14 8 32 8 Q50 8 50 30 L50 35 Q50 39 46 39 L18 39 Q14 39 14 35 Z" fill="var(--accent)"/>
    <circle cx="24" cy="21" r="3.2" fill="var(--bg)"/>

    <g fill="none" stroke="var(--accent)" stroke-width="4.2" stroke-linecap="round">

  <button class="btn btn-ghost" id="btnSignOut" hidden>Se déconnecter</button>
</div>

<div id="appRoot" hidden>
<div class="topbar">
  <div class="brand-row">
    <svg class="octopus-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 30 Q14 8 32 8 Q50 8 50 30 L50 35 Q50 39 46 39 L18 39 Q14 39 14 35 Z" fill="var(--accent)"/>
      <circle cx="24" cy="21" r="3.2" fill="var(--bg)"/>
      <circle cx="40" cy="21" r="3.2" fill="var(--bg)"/>
      <g fill="none" stroke="var(--accent)" stroke-width="4.2" stroke-linecap="round">
        <path d="M17 38 Q11 46 16 53 Q19 57 15 59"/>
        <path d="M23 39 Q20 48 24 55 Q27 59 23 60"/>
        <path d="M29 39.5 Q28 50 31 57"/>
        <path d="M35 39.5 Q36 50 33 57"/>

      <h1>Octopus</h1>

  <input type="search" id="searchInput" class="search-input" placeholder="Rechercher un client, téléphone, ville…">
  <button class="btn btn-ghost" id="btnAccepted">Devis acceptés <span id="acceptedCount">(0)</span></button>
  <button class="btn btn-ghost" id="btnRefused">Devis refusés <span id="refusedCount">(0)</span></button>
  <button class="btn btn-primary" id="btnNew">+ Nouveau lead</button>
</div>
<button class="fab-new" id="btnNewFab" aria-label="Nouveau lead">+</button>

<div id="statusBanner" class="status-banner" hidden></div>

<div class="zone-filter" id="zoneFilter"></div>

<div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal-wrap">
    <div class="modal" id="modal"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-storage-compat.js"></script>
<script>
(function(){
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDOflEa4oHbJ10sGhF5EzgbeuOZGKUflP8",
    authDomain: "octopus-ed04d.firebaseapp.com",
    projectId: "octopus-ed04d",
    storageBucket: "octopus-ed04d.firebasestorage.app",
    messagingSenderId: "5809628281",
    appId: "1:5809628281:web:7fc01581c810fd36bf60a8"
  };
  var ALLOWED_EMAILS = ["mallaurylacoste95@gmail.com", "contact.eneoji@gmail.com"];

  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth();
  var storage = firebase.storage();
  try{ firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}

  var PENDING_DB_NAME = "octopus-pending-photos";
  var PENDING_STORE = "photos";
  function openPendingDb(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(PENDING_DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(PENDING_STORE, {keyPath:"localId"}); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function addPendingPhoto(rec){
    return openPendingDb().then(function(idb){
      return new Promise(function(resolve, reject){
        var tx = idb.transaction(PENDING_STORE, "readwrite");
        tx.objectStore(PENDING_STORE).put(rec);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function getPendingPhotosForLead(leadId){
    return openPendingDb().then(function(idb){
      return new Promise(function(resolve, reject){
        var req = idb.transaction(PENDING_STORE, "readonly").objectStore(PENDING_STORE).getAll();
        req.onsuccess = function(){ resolve(req.result.filter(function(r){ return r.leadId === leadId; })); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function getAllPendingPhotos(){
    return openPendingDb().then(function(idb){
      return new Promise(function(resolve, reject){

      var projX = a.x + t*dx, projY = a.y + t*dy;

      var stamps = [];

      function stampBounds(s){
        var base = STAMP_BASE_SIZES[s.type];
        var w0 = base.w * s.scale, h0 = base.h * s.scale;
        return {left: s.x - w0/2, right: s.x + w0/2, top: s.y - h0/2, bottom: s.y + h0/2};
      }
      function hitTestStamp(pt){
        for(var i = stamps.length - 1; i >= 0; i--){
          var b = stampBounds(stamps[i]);
          if(pt.x >= b.left && pt.x <= b.right && pt.y >= b.top && pt.y <= b.bottom) return stamps[i];
        }
        return null;
      }
      function renderStampsLayer(){
        stampsCtx.clearRect(0, 0, w, h);
        stamps.forEach(function(s){
          STAMP_DRAWERS[s.type](stampsCtx, s.x, s.y, s.color, s.scale);
          if(s === selectedStamp){
            var b = stampBounds(s);
            stampsCtx.save();
            stampsCtx.strokeStyle = "#1E88E5"; stampsCtx.setLineDash([6,4]); stampsCtx.lineWidth = 2;
            stampsCtx.strokeRect(b.left - 6, b.top - 6, (b.right-b.left) + 12, (b.bottom-b.top) + 12);
            stampsCtx.restore();
          }
        });
      }

      var drawing = false, last = null, tracePoints = [];
      var activePointers = {};
      var pinchStartDist = null, pinchStartScale = 1;
      function toCanvasPoint(e){
        var r = previewCanvas.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) * (previewCanvas.width / r.width),
          y: (e.clientY - r.top) * (previewCanvas.height / r.height)
        };
      }
      function pointerDist(){
        var ids = Object.keys(activePointers);
        if(ids.length < 2) return null;
        var a = activePointers[ids[0]], b = activePointers[ids[1]];
        return Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y));
      }
      var TRACE_EPSILON = 50;
      var TRACE_TOOLS = {goulotte:1, elec:1, condensats:1};
      function renderTracePreview(){
        previewCtx.clearRect(0, 0, w, h);
        if(tracePoints.length < 1) return;
        var pts = simplifyPath(tracePoints, TRACE_EPSILON);
        drawTraceLine(previewCtx, pts, tool, dashedMode);
      }
      var STAMP_TOOLS = {stampUE:"UE", stampUI:"UI", stampPAC:"PAC", stampBT:"BT"};
      var movingStamp = false, moveStart = null;
      previewCanvas.addEventListener("pointerdown", function(e){
        var pt = toCanvasPoint(e);
        activePointers[e.pointerId] = pt;
        previewCanvas.setPointerCapture(e.pointerId);

        if(Object.keys(activePointers).length >= 2 && selectedStamp){
          movingStamp = false;
          drawing = false;
          pinchStartDist = pointerDist();
          pinchStartScale = selectedStamp.scale;
          return;
        }

        if(STAMP_TOOLS[tool]){
          var hit = hitTestStamp(pt);
          if(hit){
            selectedStamp = hit;
          } else {
            selectedStamp = {type: STAMP_TOOLS[tool], x: pt.x, y: pt.y, scale: 1, color: color};
            stamps.push(selectedStamp);
          }
          movingStamp = true;
          moveStart = {x: pt.x, y: pt.y, stampX: selectedStamp.x, stampY: selectedStamp.y};
          renderStampsLayer();
          return;
        }

        if(selectedStamp){ selectedStamp = null; renderStampsLayer(); }
        drawing = true;
        last = pt;
        if(TRACE_TOOLS[tool]) tracePoints = [pt];
      });
      previewCanvas.addEventListener("pointermove", function(e){
        if(!(e.pointerId in activePointers)) return;
        var pt = toCanvasPoint(e);
        activePointers[e.pointerId] = pt;

        if(pinchStartDist !== null && selectedStamp){
          var dist = pointerDist();
          if(dist){
            var newScale = pinchStartScale * (dist / pinchStartDist);
            newScale = Math.max(0.4, Math.min(3, newScale));
            selectedStamp.scale = newScale;
            renderStampsLayer();
          }
          return;
        }

        if(movingStamp && selectedStamp && Object.keys(activePointers).length === 1){
          selectedStamp.x = moveStart.stampX + (pt.x - moveStart.x);
          selectedStamp.y = moveStart.stampY + (pt.y - moveStart.y);
          renderStampsLayer();
          return;
        }

        if(!drawing) return;
        if(TRACE_TOOLS[tool]){
          tracePoints.push(pt);
          renderTracePreview();
          last = pt;
          return;
        }
        drawCtx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
        drawCtx.strokeStyle = color;
        drawCtx.lineWidth = tool === "eraser" ? 24 : 5;
        drawCtx.lineCap = "round";
        drawCtx.lineJoin = "round";
        drawCtx.beginPath();
        drawCtx.moveTo(last.x, last.y);
        drawCtx.lineTo(pt.x, pt.y);
        drawCtx.stroke();
        last = pt;
      });
      function endStroke(e){
        delete activePointers[e.pointerId];
        if(Object.keys(activePointers).length < 2) pinchStartDist = null;
        movingStamp = false;
        if(TRACE_TOOLS[tool]){
          previewCtx.clearRect(0, 0, w, h);
          if(tracePoints.length > 1) drawTraceLine(drawCtx, simplifyPath(tracePoints, TRACE_EPSILON), tool, dashedMode);
        }
        tracePoints = [];
        drawing = false;
      }
      previewCanvas.addEventListener("pointerup", endStroke);
      previewCanvas.addEventListener("pointercancel", endStroke);

      ov.querySelector("#annotClear").addEventListener("click", function(){
        drawCtx.clearRect(0, 0, w, h);
        previewCtx.clearRect(0, 0, w, h);
        stamps = [];
        selectedStamp = null;
        renderStampsLayer();
      });
      ov.querySelector("#annotCancel").addEventListener("click", function(){
        document.body.removeChild(ov);
        resolve({cancelled: true});
      });
      ov.querySelector("#annotOk").addEventListener("click", function(){
        selectedStamp = null;

        outCtx.drawImage(baseCanvas, 0, 0);

          resolve({blob: blob});

      });
    });
  }

  function annotatePhoto(file, indexLabel){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      var loadTimeout = setTimeout(function(){
        URL.revokeObjectURL(url);
        resolve(file);
      }, 8000);
      img.onload = function(){
        clearTimeout(loadTimeout);
        openAnnotator(img, {indexLabel: indexLabel, cancelLabel: "Annuler la photo", validateLabel: "Valider"}).then(function(res){
          URL.revokeObjectURL(url);
          resolve(res.cancelled ? null : (res.blob || file));
        });
      };
      img.onerror = function(){ clearTimeout(loadTimeout); URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function viewPhoto(photos, startIndex, onEdit){
    var idx = startIndex || 0;
    var multi = photos.length > 1;
    var ov = document.createElement("div");
    ov.className = "annot-overlay";
    ov.innerHTML =
      '<div class="annot-panel">' +
        '<div class="view-stage" id="viewStage">' +
          '<img id="viewImg" src="' + esc(photos[idx].url) + '">' +
          (multi ? '<button type="button" class="view-nav prev" id="viewPrev" aria-label="Photo précédente">‹</button>' : '') +
          (multi ? '<button type="button" class="view-nav next" id="viewNext" aria-label="Photo suivante">›</button>' : '') +
        '</div>' +
        '<div class="annot-actions">' +
          (onEdit ? '<button type="button" class="btn btn-ghost" id="viewEdit">✏️ Modifier</button>' : '<div></div>') +
          '<button type="button" class="btn btn-primary" id="viewClose">Fermer</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);

    var viewStage = ov.querySelector("#viewStage");
    var viewImg = ov.querySelector("#viewImg");
    var prevBtn = ov.querySelector("#viewPrev");
    var nextBtn = ov.querySelector("#viewNext");

    var scale = 1, panX = 0, panY = 0;
    var activePointers = {};
    var pinchStartDist = null, pinchStartScale = 1;
    var dragging = false, dragStart = null, panStart = null;
    var lastTapTime = 0;

    function applyTransform(){
      viewImg.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + scale + ")";
    }
    function resetZoom(){ scale = 1; panX = 0; panY = 0; applyTransform(); }
    function dist(a, b){ return Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y)); }

    function go(delta){
      idx = (idx + delta + photos.length) % photos.length;
      resetZoom();
      viewImg.src = photos[idx].url;
    }
    if(prevBtn) prevBtn.addEventListener("click", function(){ go(-1); });
    if(nextBtn) nextBtn.addEventListener("click", function(){ go(1); });

    viewStage.addEventListener("pointerdown", function(e){
      activePointers[e.pointerId] = {x: e.clientX, y: e.clientY};
      viewStage.setPointerCapture(e.pointerId);
      var ids = Object.keys(activePointers);
      if(ids.length === 2){
        var pts = ids.map(function(id){ return activePointers[id]; });
        pinchStartDist = dist(pts[0], pts[1]);
        pinchStartScale = scale;
        dragging = false;
      } else if(ids.length === 1){
        var now = Date.now();
        if(now - lastTapTime < 300){
          scale = scale > 1 ? 1 : 2.5;
          panX = 0; panY = 0;
          applyTransform();
          lastTapTime = 0;
        } else {
          lastTapTime = now;
        }
        if(scale > 1){
          dragging = true;
          dragStart = {x: e.clientX, y: e.clientY};
          panStart = {x: panX, y: panY};
        }
      }
    });
    viewStage.addEventListener("pointermove", function(e){
      if(!(e.pointerId in activePointers)) return;
      activePointers[e.pointerId] = {x: e.clientX, y: e.clientY};
      var ids = Object.keys(activePointers);
      if(ids.length === 2 && pinchStartDist){
        var pts = ids.map(function(id){ return activePointers[id]; });
        var d = dist(pts[0], pts[1]);
        scale = Math.max(1, Math.min(4, pinchStartScale * (d / pinchStartDist)));
        applyTransform();
        return;
      }
      if(dragging){
        panX = panStart.x + (e.clientX - dragStart.x);
        panY = panStart.y + (e.clientY - dragStart.y);
        applyTransform();
      }
    });
    function endPointer(e){
      delete activePointers[e.pointerId];
      if(Object.keys(activePointers).length < 2) pinchStartDist = null;
      dragging = false;
      if(scale <= 1){ scale = 1; panX = 0; panY = 0; applyTransform(); }
    }
    viewStage.addEventListener("pointerup", endPointer);
    viewStage.addEventListener("pointercancel", endPointer);
    viewStage.addEventListener("wheel", function(e){
      e.preventDefault();
      var factor = e.deltaY < 0 ? 1.15 : 1/1.15;
      scale = Math.max(1, Math.min(4, scale * factor));
      if(scale <= 1){ scale = 1; panX = 0; panY = 0; }
      applyTransform();
    }, {passive: false});

    function onKey(e){
      if(e.key === "ArrowLeft") go(-1);
      else if(e.key === "ArrowRight") go(1);
      else if(e.key === "Escape") finish();
    }
    document.addEventListener("keydown", onKey);

    function finish(){
      document.removeEventListener("keydown", onKey);
      document.body.removeChild(ov);
    }
    ov.addEventListener("click", function(e){ if(e.target === ov) finish(); });
    ov.querySelector("#viewClose").addEventListener("click", finish);
    var editBtn = ov.querySelector("#viewEdit");
    if(editBtn) editBtn.addEventListener("click", function(){ var p = photos[idx]; finish(); onEdit(p); });
  }

  function formatPhoneDisplay(phone){
    if(!phone) return "";
    var digits = phone.replace(/[^0-9]/g, "");
    if(digits.length === 10) return digits.match(/.{2}/g).join(" ");
    return phone;
  }

  function telHref(phone){
    return "tel:" + phone.replace(/[^0-9+]/g, "");
  }

  function formatDateOnly(ts){
    if(!ts) return "";
    var d = new Date(ts);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
  }

  function toDateInputValue(ts){
    var d = ts ? new Date(ts) : new Date();
    function p(n){ return n < 10 ? "0"+n : ""+n; }
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
  }

  function parseDateInputToTs(v){
    if(!v) return null;
    var parts = v.split("-");
    var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10), 12, 0, 0);
    return d.getTime();
  }

  function formatRdv(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"}) + " à " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }

  function toGCalUTC(d){
    function p(n){ return n < 10 ? "0"+n : ""+n; }
    return d.getUTCFullYear() + p(d.getUTCMonth()+1) + p(d.getUTCDate()) + "T" + p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
  }

  function gcalLink(iso, title, details, location, endIso){
    var start = new Date(iso);
    if(isNaN(start.getTime())) return null;
    var end = endIso ? new Date(endIso) : new Date(start.getTime() + 60*60*1000);
    if(isNaN(end.getTime()) || end.getTime() <= start.getTime()) end = new Date(start.getTime() + 60*60*1000);
    var params = new URLSearchParams({
      action:"TEMPLATE", text:title,
      dates: toGCalUTC(start) + "/" + toGCalUTC(end),
      details: details || "",
      location: location || ""
    });
    return "https://calendar.google.com/calendar/render?" + params.toString();
  }

      } else {
        if(col.key === "rdv_programme"){
          items.sort(function(a,b){
            var da = a.rdvDate ? new Date(a.rdvDate).getTime() : Infinity;
            var db2 = b.rdvDate ? new Date(b.rdvDate).getTime() : Infinity;
            return da - db2;
          });
        } else if(col.key === "nouveau"){
          items.sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
        } else if(col.key === "rdv_fait"){
          items.sort(function(a,b){
            var da = a.rdvDate ? new Date(a.rdvDate).getTime() : (a.createdAt||0);
            var db2 = b.rdvDate ? new Date(b.rdvDate).getTime() : (b.createdAt||0);
            return da - db2;
          });
        } else if(col.key === "devis_envoye"){
          items.sort(function(a,b){
            var da = a.devisEnvoyeDate || Infinity;
            var db2 = b.devisEnvoyeDate || Infinity;
            return da - db2;
          });
        } else {
          items.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
        }
        var relanceMarkerShown = false;
        items.forEach(function(l){
          if(col.key === "devis_envoye" && !relanceMarkerShown && l.devisEnvoyeDate){
            var daysSentCheck = (Date.now() - l.devisEnvoyeDate) / 86400000;
            if(daysSentCheck >= 20){

              marker.className = "relance-marker";
              marker.textContent = "⏰ À relancer (J+20)";
              cardsEl.appendChild(marker);

          }
          var card = document.createElement("div");
          var staleDays = (col.key === "devis_envoye" && l.devisEnvoyeDate)
            ? (Date.now() - l.devisEnvoyeDate) / 86400000
            : (l.updatedAt ? (Date.now() - l.updatedAt) / 86400000 : 0);
          var isDevisStage = (l.stage === "devis_envoye" || l.stage === "devis_relance");
          var staleClass = "", staleFlag = "";
          if(isDevisStage && staleDays >= 40){
            staleClass = " stale-urgent";
            staleFlag = '<div class="stale-flag urgent">⏰ Relance urgente</div>';
          }
          card.className = "card" + staleClass;
          card.dataset.leadId = l.id;

    var photoGrid = document.getElementById("photoGrid");

    function editSavedPhoto(photoObj, isPending){
      var src = isPending ? URL.createObjectURL(photoObj.blob) : photoObj.url;
      var img = new Image();
      if(!isPending) img.crossOrigin = "anonymous";
      img.onload = function(){
        openAnnotator(img, {cancelLabel: "Fermer sans modifier", validateLabel: "Enregistrer la modification"}).then(function(res){
          if(isPending) URL.revokeObjectURL(src);
          if(res.cancelled || !res.blob) return;
          var blob = res.blob;
          if(isPending){
            addPendingPhoto({localId: photoObj.id, leadId: l.id, blob: blob, path: photoObj.path}).then(renderPhotoGrid);
            return;
          }
          if(!navigator.onLine || !storage || !db || !canWrite){
            showBanner("Pas de connexion : impossible d'enregistrer la modification pour le moment. Réessaie plus tard.");
            return;
          }
          uploadWithTimeout(blob, photoObj.path, 15000).then(function(uploadRes){
            if(!uploadRes.ok){
              showBanner("Échec de l'enregistrement de la modification. Réessaie.");
              return;
            }
            var idx = (l.photos || []).findIndex(function(p){ return p.id === photoObj.id; });
            if(idx !== -1){
              l.photos[idx] = Object.assign({}, l.photos[idx], {url: uploadRes.url});
              if(db && canWrite) db.collection("leads").doc(l.id).update({photos: l.photos});
            }
            renderPhotoGrid();
          });
        });
      };
      img.onerror = function(){ if(isPending) URL.revokeObjectURL(src); showBanner("Impossible de charger la photo pour modification."); };
      img.src = src;
    }
    function renderPhotoGrid(){
      var photos = Array.isArray(l.photos) ? l.photos : [];
      getPendingPhotosForLead(l.id).then(function(pending){
        var pendingPhotos = pending.map(function(p){ return {id: p.localId, url: URL.createObjectURL(p.blob), pending: true, blob: p.blob, path: p.path}; });
        var all = photos.concat(pendingPhotos);
        photoGrid.innerHTML = all.map(function(p){
          return '<div class="photo-thumb" data-id="' + esc(p.id) + '">' +
            '<img src="' + esc(p.url) + '">' +
            (p.pending ? '<div class="photo-pending">⏳</div>' : '<button type="button" class="rm" title="Supprimer">×</button>') +
          '</div>';
        }).join("") +
          '<button type="button" class="photo-add" id="btnAddPhotoCamera" title="Prendre une photo">📷</button>' +
          '<button type="button" class="photo-add" id="btnAddPhotoGallery" title="Depuis la galerie">🖼️</button>';

          });
        });
        Array.prototype.forEach.call(photoGrid.querySelectorAll(".rm"), function(btn){
          btn.addEventListener("click", function(e){
            e.stopPropagation();
            var id = btn.parentElement.dataset.id;
            var removed = (l.photos || []).find(function(p){ return p.id === id; });
            l.photos = (l.photos || []).filter(function(p){ return p.id !== id; });
            renderPhotoGrid();
            if(db && canWrite) db.collection("leads").doc(l.id).update({photos: l.photos});
            if(removed && removed.path) storage.ref(removed.path).delete().catch(function(){});
          });
        });
      });
    }

    function handlePickedFiles(files){
      if(!files.length) return;
      var camBtn = document.getElementById("btnAddPhotoCamera");
      var galBtn = document.getElementById("btnAddPhotoGallery");
      if(camBtn) camBtn.disabled = true;
      if(galBtn) galBtn.disabled = true;

      function resetBtns(){ if(camBtn) camBtn.disabled = false; if(galBtn) galBtn.disabled = false; }

      function annotateNext(i, blobs){
        if(i >= files.length){
          if(!blobs.length){ resetBtns(); return; }
          if(!storage || !db || !canWrite){
            showBanner("L'ajout de photo n'est pas disponible pour le moment.");
            resetBtns();
            return;
          }
          Promise.all(blobs.map(function(b){
            var photoId = "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
            var path = "leads/" + l.id + "/" + photoId + ".jpg";
            function queueIt(){
              return addPendingPhoto({localId: photoId, leadId: l.id, blob: b, path: path}).then(function(){ return {pending:true}; });
            }
            if(!navigator.onLine) return queueIt();
            return uploadWithTimeout(b, path, 6000).then(function(res){
              if(res.ok) return {id: photoId, url: res.url, path: path};
              return queueIt();
            });
          })).then(function(results){
            var synced = results.filter(function(r){ return !r.pending; });
            var pendingCount = results.length - synced.length;
            if(synced.length){
              l.photos = (l.photos || []).concat(synced);
              if(db && canWrite) db.collection("leads").doc(l.id).update({photos: l.photos});
            }
            renderPhotoGrid();
            if(pendingCount) showBanner(pendingCount + " photo(s) en attente de réseau : elles s'enverront automatiquement au retour de la connexion.");
          }).catch(function(err){
            showBanner("Échec de l'envoi de la photo (" + ((err && err.code) || "erreur") + "). Réessaie.");
            resetBtns();
          });
          return;
        }
        var label = files.length > 1 ? ("Photo " + (i + 1) + " / " + files.length) : "";
        annotatePhoto(files[i], label).then(function(blob){
          if(blob) blobs.push(blob);
          annotateNext(i + 1, blobs);
        });
      }
      annotateNext(0, []);
    }

    photoInputCamera.addEventListener("change", function(){
      var files = Array.prototype.slice.call(photoInputCamera.files || []);
      photoInputCamera.value = "";
      handlePickedFiles(files);
    });
    photoInputGallery.addEventListener("change", function(){
      var files = Array.prototype.slice.call(photoInputGallery.files || []);

    function buildPatchFromForm(){
      var newStage = document.getElementById("fStage").value;
      var newRdvDate = document.getElementById("fRdvDate").value || null;
      if(newStage === "nouveau" && newRdvDate){
        newStage = "rdv_programme";
      }
      var devisDateVal = document.getElementById("fDevisEnvoyeDate").value;
      var devisEnvoyeDate = devisDateVal ? parseDateInputToTs(devisDateVal) : (l.devisEnvoyeDate || null);
      if(newStage === "devis_envoye" && l.stage !== "devis_envoye" && !devisEnvoyeDate){
        devisEnvoyeDate = Date.now();
      }
      return {
        devisEnvoyeDate: devisEnvoyeDate,
        prenom: document.getElementById("fPrenom").value.trim(),
        nom: document.getElementById("fNom").value.trim(),
        name: null,
        ville: document.getElementById("fVille").value.trim(),
        phone: document.getElementById("fPhone").value.trim(),
        adresse: document.getElementById("fAdresse").value.trim(),
        email: document.getElementById("fEmail").value.trim(),
        equipment: readEquipment(),
        zone: document.getElementById("fZone").value,
        source: document.getElementById("fSource").value,
        mailLink: document.getElementById("fMailLink").value.trim(),
        createdAt: parseDateInputToTs(document.getElementById("fReceivedDate").value) || l.createdAt || Date.now(),
        stage: newStage,
        rdvDate: newRdvDate,
        crVisite: document.getElementById("fCrVisite").value.trim(),
        notes: document.getElementById("fNotes").value.trim(),
        updatedAt: Date.now()
      };
    }
    function savePatch(patch){
      Object.assign(l, patch);
      render();
      closeModal();
      if(db && canWrite){
        db.collection("leads").doc(l.id).update(patch).catch(function(err){
          if(err && err.code === "permission-denied") showBanner("Lecture seule : tu n'as pas les droits pour modifier ce tableau.");
        });
      }
    }
    function doAutoSave(){
      var patch = buildPatchFromForm();
      var rdvChanged = patch.rdvDate && patch.rdvDate !== lastOfferedRdvDate;
      Object.assign(l, patch);
      render();
      if(saveStatusEl){ saveStatusEl.textContent = "Enregistrement…"; saveStatusEl.classList.remove("ok"); }
      if(db && canWrite){
        db.collection("leads").doc(l.id).update(patch).then(function(){
          if(saveStatusEl){ saveStatusEl.textContent = "✓ Enregistré"; saveStatusEl.classList.add("ok"); }
        }).catch(function(err){
          if(saveStatusEl) saveStatusEl.textContent = "";
          if(err && err.code === "permission-denied") showBanner("Lecture seule : tu n'as pas les droits pour modifier ce tableau.");
        });
      }
      if(rdvChanged){
        lastOfferedRdvDate = patch.rdvDate;
        var title = "RDV — " + (displayName(Object.assign({}, l, patch)) || "client");
        var desc = "Équipement : " + (toArray(patch.equipment).join(", ") || "—") + (patch.phone ? "\nTél : " + patch.phone : "");
        var link = gcalLink(patch.rdvDate, title, desc, patch.adresse);
        if(link) showConfirm("Ajouter ce RDV à Google Agenda ?", function(){ window.open(link, "_blank", "noopener"); });
      }
    }
    formWrap.addEventListener("input", function(){
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(doAutoSave, 600);
    });
    formWrap.addEventListener("change", function(){
      clearTimeout(autoSaveTimer);
      doAutoSave();
    });
    document.getElementById("btnSave").addEventListener("click", function(){
      flushAutoSave();
      closeModal();
    });

    var delBtn = document.getElementById("btnDelete");
    var confirming = false, timer = null;
    delBtn.addEventListener("click", function(){
      if(!confirming){
        confirming = true;
        delBtn.textContent = "Confirmer la suppression ?";
        delBtn.classList.add("confirm");
        timer = setTimeout(function(){
          confirming = false;
          delBtn.textContent = "Supprimer";
          delBtn.classList.remove("confirm");
        }, 3000);
        return;
      }
      clearTimeout(timer);
      leads = leads.filter(function(x){ return x.id !== l.id; });
      render();
      closeModal();
      if(db && canWrite) db.collection("leads").doc(l.id).delete();
    });
  }

  function openNew(initialStage){
    var targetStage = initialStage || "nouveau";
    var targetLabel = targetStage === "nouveau" ? "" : ((COLUMNS.find(function(c){ return c.key === targetStage; }) || {}).label || "");
    overlay.hidden = false;
    modal.innerHTML = '<div id="formWrap">' +
      '<button class="modal-close" id="mClose" aria-label="Fermer">×</button>' +
      '<h2>Nouveau lead' + (targetLabel ? ' — ' + esc(targetLabel) : '') + ' <span class="save-status" id="saveStatus"></span></h2>' +
      '<div class="field"><label>Date de réception du lead</label><input type="date" id="fReceivedDate" value="' + toDateInputValue() + '"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Prénom</label><input id="fPrenom" placeholder="Ex. Jean"></div>' +
        '<div class="field"><label>Nom</label><input id="fNom" placeholder="Ex. Dupont"></div>' +
      '</div>' +
      '<div class="field"><label>Ville</label><input id="fVille" placeholder="Ex. Dax"></div>' +
      '<div class="field"><label>Zone</label><select id="fZone">' + zoneOptions() + '</select></div>' +
      '<div class="field"><label>Adresse précise</label><input id="fAdresse" placeholder="N°, rue, code postal et ville"></div>' +
      '<div class="field"><label>Téléphone</label><input id="fPhone" placeholder="06 00 00 00 00"></div>' +
      '<div class="field"><label>Email</label><input id="fEmail"></div>' +
      '<div class="field"><label>Équipement</label>' + equipmentCheckboxes() + '</div>' +
      '<div class="field"><label>Source</label><select id="fSource">' + sourceOptions() + '</select></div>' +
      '<div class="field"><label>Date du RDV (si connue)</label><input type="datetime-local" id="fRdvDate"></div>' +
      '<div class="field"><label>Notes</label><textarea id="fNotes" placeholder="Contexte, besoin…"></textarea></div>' +
      '<div class="modal-actions"><div></div><div class="right"><button class="btn btn-ghost" id="btnCancel">Annuler</button><button class="btn btn-primary" id="btnCreate">Fermer</button></div></div>' +
    '</div>';

    var formWrap = document.getElementById("formWrap");
    wireEquipmentChips();

    var saveStatusEl = document.getElementById("saveStatus");
    var autoSaveTimer = null;
    var createdLeadId = null;
    var creating = false;
    var pendingPatchAfterCreate = null;
    var cancelledAfterCreate = false;
    var lastOfferedRdvDate = null;

    function getFormData(){
      var newRdvDate = document.getElementById("fRdvDate").value || null;
      var finalStage = (targetStage === "nouveau" && newRdvDate) ? "rdv_programme" : targetStage;
      return {
        prenom: document.getElementById("fPrenom").value.trim(),
        nom: document.getElementById("fNom").value.trim(),
        ville: document.getElementById("fVille").value.trim(),
        phone: document.getElementById("fPhone").value.trim(),
        adresse: document.getElementById("fAdresse").value.trim(),
        email: document.getElementById("fEmail").value.trim(),
        equipment: readEquipment(),
        zone: document.getElementById("fZone").value,
        source: document.getElementById("fSource").value,
        rdvDate: newRdvDate,
        notes: document.getElementById("fNotes").value.trim(),
        stage: finalStage
      };
    }
    function hasAnyData(d){
      return !!(d.prenom || d.nom || d.phone || d.ville || d.adresse || d.email || d.notes || d.rdvDate);
    }
    function offerCalendarIfNeeded(d){
      if(d.rdvDate && d.rdvDate !== lastOfferedRdvDate){
        lastOfferedRdvDate = d.rdvDate;
        var title = "RDV — " + ((d.prenom + " " + d.nom).trim() || "client");
        var desc = "Équipement : " + (toArray(d.equipment).join(", ") || "—") + (d.phone ? "\nTél : " + d.phone : "");
        var link = gcalLink(d.rdvDate, title, desc, d.adresse);
        if(link) showConfirm("Ajouter ce RDV à Google Agenda ?", function(){ window.open(link, "_blank", "noopener"); });
      }
    }
    function doAutoSave(){
      var d = getFormData();
      if(!hasAnyData(d)) return;
      var now = Date.now();
      if(saveStatusEl){ saveStatusEl.textContent = "Enregistrement…"; saveStatusEl.classList.remove("ok"); }
      if(creating){
        var lxPending = leads.find(function(x){ return x.id === createdLeadId; });
        var patchPending = Object.assign({}, d, {updatedAt: now});
        if(lxPending) Object.assign(lxPending, patchPending);
        render();
        pendingPatchAfterCreate = patchPending;
        return;
      }
      if(!createdLeadId){
        if(!db || !canWrite) return;
        creating = true;
        var data = Object.assign({}, d, {
          createdAt: parseDateInputToTs(document.getElementById("fReceivedDate").value) || now,
          updatedAt: now,
          createdBy: myId || null
        });
        var localId = "tmp_" + now;
        createdLeadId = localId;
        leads.push(Object.assign({id: localId}, data));
        render();
        db.collection("leads").add(data).then(function(ref){
          creating = false;
          if(cancelledAfterCreate){
            db.collection("leads").doc(ref.id).delete().catch(function(){});
            return;
          }
          var lx = leads.find(function(x){ return x.id === localId; });
          if(lx) lx.id = ref.id;
          if(createdLeadId === localId) createdLeadId = ref.id;
          if(seenLeadIds) seenLeadIds[ref.id] = true;
          if(pendingPatchAfterCreate){
            var p = pendingPatchAfterCreate;
            pendingPatchAfterCreate = null;
            db.collection("leads").doc(ref.id).update(p).then(function(){
              if(saveStatusEl){ saveStatusEl.textContent = "✓ Enregistré"; saveStatusEl.classList.add("ok"); }
              offerCalendarIfNeeded(getFormData());
            }).catch(function(err){
              if(saveStatusEl) saveStatusEl.textContent = "";
              if(err && err.code === "permission-denied") showBanner("Lecture seule : tu n'as pas les droits pour modifier ce tableau.");
            });
          } else {
            if(saveStatusEl){ saveStatusEl.textContent = "✓ Enregistré"; saveStatusEl.classList.add("ok"); }
            offerCalendarIfNeeded(d);
          }
        }).catch(function(err){
          creating = false;
          leads = leads.filter(function(x){ return x.id !== localId; });
          createdLeadId = null;
          render();
          if(saveStatusEl) saveStatusEl.textContent = "";
          if(err && err.code === "permission-denied") showBanner("Lecture seule : tu n'as pas les droits pour ajouter un lead.");
        });
      } else {
        var lx = leads.find(function(x){ return x.id === createdLeadId; });
        var patch = Object.assign({}, d, {updatedAt: now});
        if(lx) Object.assign(lx, patch);
        render();
        if(db && canWrite){
          db.collection("leads").doc(createdLeadId).update(patch).then(function(){
            if(saveStatusEl){ saveStatusEl.textContent = "✓ Enregistré"; saveStatusEl.classList.add("ok"); }
            offerCalendarIfNeeded(d);
          }).catch(function(err){
            if(saveStatusEl) saveStatusEl.textContent = "";
            if(err && err.code === "permission-denied") showBanner("Lecture seule : tu n'as pas les droits pour modifier ce tableau.");
          });
        }
      }
    }
    function flushAutoSave(){ clearTimeout(autoSaveTimer); doAutoSave(); }
    formWrap.addEventListener("input", function(){
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(doAutoSave, 600);
    });
    formWrap.addEventListener("change", function(){
      clearTimeout(autoSaveTimer);
      doAutoSave();
    });

    document.getElementById("mClose").addEventListener("click", function(){ flushAutoSave(); closeModal(); });
    document.getElementById("btnCreate").addEventListener("click", function(){ flushAutoSave(); closeModal(); });
    document.getElementById("btnCancel").addEventListener("click", function(){
      clearTimeout(autoSaveTimer);
      pendingPatchAfterCreate = null;
      if(createdLeadId){
        var idToDelete = createdLeadId;
        leads = leads.filter(function(x){ return x.id !== idToDelete; });
        render();
        if(String(idToDelete).indexOf("tmp_") === 0){
          cancelledAfterCreate = true;
        } else if(db && canWrite){
          db.collection("leads").doc(idToDelete).delete().catch(function(){});
        }
      }
      closeModal();
    });
  }

  btnNew.addEventListener("click", function(){ openNew(); });
  var btnNewFab = document.getElementById("btnNewFab");
  if(btnNewFab) btnNewFab.addEventListener("click", function(){ openNew(); });
  document.getElementById("btnAccepted").addEventListener("click", function(){ openHiddenStageList("devis_accepte", "Devis acceptés"); });
  document.getElementById("btnRefused").addEventListener("click", function(){ openHiddenStageList("devis_refuse", "Devis refusés"); });

  render();

  var authGate = document.getElementById("authGate");
  var authGateMsg = document.getElementById("authGateMsg");
  var btnGoogleSignIn = document.getElementById("btnGoogleSignIn");
  var btnSignOut = document.getElementById("btnSignOut");
  var appRoot = document.getElementById("appRoot");

  function showAuthGate(msg, showSignIn, showSignOut){
    appRoot.hidden = true;
    authGate.hidden = false;
    authGateMsg.textContent = msg;
    btnGoogleSignIn.hidden = !showSignIn;
    btnSignOut.hidden = !showSignOut;
  }

  btnGoogleSignIn.addEventListener("click", function(){
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(err){
      if(err && err.code === "auth/popup-blocked"){
        auth.signInWithRedirect(provider).catch(function(err2){
          showAuthGate("Connexion impossible (" + ((err2 && err2.code) || "erreur") + "). Réessaie.", true, false);
        });
        return;
      }
      if(err && (err.code === "auth/cancelled-popup-request" || err.code === "auth/popup-closed-by-user")) return;
      showAuthGate("Connexion impossible (" + ((err && err.code) || "erreur") + "). Réessaie.", true, false);
    });
  });
  btnSignOut.addEventListener("click", function(){ auth.signOut(); });

  auth.getRedirectResult().catch(function(err){
    if(err && err.code) showAuthGate("Connexion impossible (" + err.code + "). Réessaie.", true, false);
  });

  auth.onAuthStateChanged(function(user){
    if(!user){
      myId = null;
      db = null;
      showAuthGate("Connecte-toi pour accéder au pipeline.", true, false);
      return;
    }
    var email = (user.email || "").toLowerCase();
    if(ALLOWED_EMAILS.indexOf(email) === -1){
      myId = null;
      db = null;
      showAuthGate("Le compte " + email + " n'est pas autorisé sur Octopus.", false, true);
      return;
    }
    myId = user.uid;
    appRoot.hidden = false;
    authGate.hidden = true;
    if(!db){
      db = firebase.firestore();
      db.collection("leads").onSnapshot(function(snap){
        dbReady = true;
        var newLeads = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        if(seenLeadIds){
          newLeads.forEach(function(l){
            if(l.stage === "nouveau" && !seenLeadIds[l.id]) addPendingNewLead(l.id);
          });
        }
        seenLeadIds = {};
        newLeads.forEach(function(l){ seenLeadIds[l.id] = true; });
        leads = newLeads;
        render();
      }, function(err){
        dbReady = true;
        if(err && err.code === "permission-denied") showBanner("Accès refusé à ce tableau.");
        else showBanner("Impossible de charger les leads pour le moment.");
        render();
      });
      flushPendingPhotos();
    }
  });
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js");
  });
}
</script>
</body>
